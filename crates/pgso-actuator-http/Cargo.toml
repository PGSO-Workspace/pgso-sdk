[package]
name = "pgso-actuator-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Session-scoped PGSO execution with HTTP and MCP request adapters"

[dependencies]
pgso-core = { path = "../pgso-core" }
pgso-actuator-mcp = { path = "../pgso-actuator-mcp" }
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
jsonschema = { version = "=0.29.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

