name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Treat all rustc warnings as errors across build/test, matching the local bar.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test · doc (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings; default lint set incl. incompatible_msrv)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Validation trace input contract
        run: cargo test -p pgso-core --example validation_trace

      - name: Reproducible engineering evaluation
        run: python3 experiments/reproducibility/run.py --profile dev --output "${{ runner.temp }}/pgso-evaluation"

      - name: Doc (deny warnings; enforces #![deny(missing_docs)])
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: build (MSRV 1.83)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain (1.83)
        uses: dtolnay/rust-toolchain@1.83.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # MSRV is verified by BUILDING the published crates on 1.83 (the lowest
      # rustc that compiles them: pgso-actuator-mcp uses a `const fn(&mut self)`,
      # stabilized in 1.83). We do NOT run the test suite here: the dev/test graph
      # pulls a transitive dev-dependency (getrandom 0.4.x) that needs a newer
      # Cargo, so the full suite runs on stable in the `check` job above.
      - name: Build (verifies the declared MSRV compiles the crates)
        run: cargo build --workspace --locked
