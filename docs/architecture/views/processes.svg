<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="-12 -12 774 1818" width="774" height="1818" font-family="Helvetica,Arial,sans-serif">
<title>Serialización de una sesión HTTP</title>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="96.0" text-anchor="middle" font-size="18" fill="#111">Cliente HTTP o MCP</text>
<rect x="430" y="0" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="590.0" y="96.0" text-anchor="middle" font-size="18" fill="#111">Host confiable</text>
<rect x="25" y="323" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="185.0" y="419.0" text-anchor="middle" font-size="18" fill="#111">Router autenticado</text>
<rect x="227" y="646" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="387.0" y="742.0" text-anchor="middle" font-size="18" fill="#111">Mutex por Runtime</text>
<rect x="227" y="968" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="387.0" y="1064.0" text-anchor="middle" font-size="18" fill="#111">Política y autorización</text>
<rect x="227" y="1291" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="387.0" y="1387.0" text-anchor="middle" font-size="18" fill="#111">Callback síncrono</text>
<rect x="227" y="1614" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="387.0" y="1710.0" text-anchor="middle" font-size="18" fill="#111">Resultado y recibo</text>
<path d="M 167,180 L 170,221 L 174,270 L 177,313" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="171" y="239" width="60" height="22" fill="white"/>
<text x="174" y="255" font-size="14" fill="#222">Petición</text>
<path d="M 241,503 L 267,544 L 299,594 L 326,637" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="290" y="562" width="106" height="22" fill="white"/>
<text x="293" y="578" font-size="14" fill="#222">Adquirir</text>
<text x="293" y="596" font-size="14" fill="#222">acceso</text>
<path d="M 562,180 L 524,299 L 457,511 L 418,636" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="513" y="400" width="163" height="22" fill="white"/>
<text x="516" y="416" font-size="14" fill="#222">observe, expiry,</text>
<text x="516" y="434" font-size="14" fill="#222">approve</text>
<path d="M 387,826 L 387,867 L 387,916 L 387,958" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="385" y="885" width="117" height="22" fill="white"/>
<text x="388" y="901" font-size="14" fill="#222">Acceso</text>
<text x="388" y="919" font-size="14" fill="#222">exclusivo</text>
<path d="M 387,1148 L 387,1190 L 387,1239 L 387,1281" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="385" y="1207" width="225" height="22" fill="white"/>
<text x="388" y="1223" font-size="14" fill="#222">Mantener exclusión durante</text>
<text x="388" y="1241" font-size="14" fill="#222">efecto</text>
<path d="M 387,1471 L 387,1512 L 387,1561 L 387,1604" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="385" y="1530" width="109" height="22" fill="white"/>
<text x="388" y="1546" font-size="14" fill="#222">Finalizar</text>
<text x="388" y="1564" font-size="14" fill="#222">intento</text>
</svg>
