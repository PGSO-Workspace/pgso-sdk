<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="-12 -12 819 2803" width="819" height="2803" font-family="Helvetica,Arial,sans-serif">
<title>Protocolo del bridge NDJSON</title>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
<rect x="159" y="0" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="319.0" y="96.0" text-anchor="middle" font-size="18" fill="#111">1. Host envía extract</text>
<rect x="159" y="323" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="319.0" y="419.0" text-anchor="middle" font-size="18" fill="#111">2. Bridge devuelve readings</text>
<rect x="159" y="646" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="319.0" y="742.0" text-anchor="middle" font-size="18" fill="#111">3. Host envía observe</text>
<rect x="159" y="968" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="319.0" y="1064.0" text-anchor="middle" font-size="18" fill="#111">4. Bridge actualiza política</text>
<rect x="159" y="1291" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="319.0" y="1387.0" text-anchor="middle" font-size="18" fill="#111">5. Host envía call</text>
<rect x="159" y="1614" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="319.0" y="1710.0" text-anchor="middle" font-size="18" fill="#111">6. Runtime autoriza</text>
<rect x="0" y="1937" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="2033.0" text-anchor="middle" font-size="18" fill="#111">Denegar sin callback</text>
<rect x="430" y="1937" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="590.0" y="2033.0" text-anchor="middle" font-size="18" fill="#111">7. Host ejecuta callback</text>
<rect x="430" y="2260" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="590.0" y="2356.0" text-anchor="middle" font-size="18" fill="#111">8. Host envía result o error</text>
<rect x="430" y="2599" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="590.0" y="2695.0" text-anchor="middle" font-size="18" fill="#111">9. Bridge devuelve recibo</text>
<path d="M 319,180 L 319,221 L 319,270 L 319,313" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="317" y="239" width="147" height="22" fill="white"/>
<text x="320" y="255" font-size="14" fill="#222">PCM y tiempo</text>
<text x="320" y="273" font-size="14" fill="#222">original</text>
<path d="M 319,503 L 319,544 L 319,593 L 319,635" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="317" y="562" width="120" height="22" fill="white"/>
<text x="320" y="578" font-size="14" fill="#222">Mismo timestamp</text>
<path d="M 319,826 L 319,867 L 319,916 L 319,958" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="317" y="885" width="139" height="22" fill="white"/>
<text x="320" y="901" font-size="14" fill="#222">Expiry y</text>
<text x="320" y="919" font-size="14" fill="#222">observación</text>
<path d="M 319,1148 L 319,1190 L 319,1239 L 319,1281" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="317" y="1207" width="106" height="22" fill="white"/>
<text x="320" y="1223" font-size="14" fill="#222">Estado</text>
<text x="320" y="1241" font-size="14" fill="#222">efectivo</text>
<path d="M 319,1471 L 319,1512 L 319,1561 L 319,1604" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="317" y="1530" width="131" height="22" fill="white"/>
<text x="320" y="1546" font-size="14" fill="#222">Expiry antes de</text>
<text x="320" y="1564" font-size="14" fill="#222">call</text>
<path d="M 275,1794 L 254,1835 L 230,1885 L 209,1928" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="242" y="1853" width="97" height="22" fill="white"/>
<text x="245" y="1869" font-size="14" fill="#222">No autorizado</text>
<path d="M 394,1794 L 430,1836 L 472,1886 L 508,1929" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="461" y="1853" width="239" height="22" fill="white"/>
<text x="464" y="1869" font-size="14" fill="#222">NDJSON: tool y argumentos exactos</text>
<path d="M 590,2117 L 590,2158 L 590,2207 L 590,2249" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="588" y="2176" width="100" height="22" fill="white"/>
<text x="591" y="2192" font-size="14" fill="#222">Un solo</text>
<text x="591" y="2210" font-size="14" fill="#222">efecto</text>
<path d="M 590,2439 L 590,2485 L 590,2542 L 590,2589" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="588" y="2499" width="209" height="38" fill="white"/>
<text x="591" y="2515" font-size="14" fill="#222">Runtime.call sigue abierto</text>
<text x="591" y="2533" font-size="14" fill="#222">hasta  respuesta</text>
</svg>
