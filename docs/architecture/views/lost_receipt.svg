<rect x="158" y="1530" width="200" height="22" fill="white"/>
<text x="161" y="1546" font-size="14" fill="#222">Fallo de transporte o</text>
<text x="161" y="1564" font-size="14" fill="#222">protocolo</text>
<path d="M 160,1794 L 160,1835 L 160,1884 L 160,1927" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="1853" width="183" height="22" fill="white"/>
<text x="161" y="1869" font-size="14" fill="#222">No repetir</text>
<text x="161" y="1887" font-size="14" fill="#222">automáticamente</text>
