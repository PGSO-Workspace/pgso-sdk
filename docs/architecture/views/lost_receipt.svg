<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="-12 -12 380 2141" width="380" height="2141" font-family="Helvetica,Arial,sans-serif">
<title>S5: recibo perdido después del efecto</title>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="96.0" text-anchor="middle" font-size="18" fill="#111">1. Host envía call</text>
<rect x="0" y="323" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="419.0" text-anchor="middle" font-size="18" fill="#111">2. Bridge autoriza callback</text>
<rect x="0" y="646" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="742.0" text-anchor="middle" font-size="18" fill="#111">3. Host ejecuta una vez</text>
<rect x="0" y="968" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="1064.0" text-anchor="middle" font-size="18" fill="#111">4. Resultado nativo</text>
<rect x="0" y="1291" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="1387.0" text-anchor="middle" font-size="18" fill="#111">5. Host responde al bridge</text>
<rect x="0" y="1614" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="1710.0" text-anchor="middle" font-size="18" fill="#111">6. Recibo ausente o inválido</text>
