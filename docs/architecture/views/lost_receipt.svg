<text x="160.0" y="2033.0" text-anchor="middle" font-size="18" fill="#111">7. Ejecución indeterminada</text>
<path d="M 160,180 L 160,221 L 160,270 L 160,313" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="239" width="136" height="22" fill="white"/>
<text x="161" y="255" font-size="14" fill="#222">Autorización</text>
<text x="161" y="273" font-size="14" fill="#222">vigente</text>
<path d="M 160,503 L 160,544 L 160,593 L 160,635" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="562" width="178" height="22" fill="white"/>
<text x="161" y="578" font-size="14" fill="#222">Tool y argumentos</text>
<text x="161" y="596" font-size="14" fill="#222">exactos</text>
<path d="M 160,826 L 160,867 L 160,916 L 160,958" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="885" width="147" height="22" fill="white"/>
<text x="161" y="901" font-size="14" fill="#222">Efecto ya pudo</text>
<text x="161" y="919" font-size="14" fill="#222">ocurrir</text>
<path d="M 160,1148 L 160,1190 L 160,1239 L 160,1281" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="1207" width="89" height="22" fill="white"/>
<text x="161" y="1223" font-size="14" fill="#222">result o</text>
<text x="161" y="1241" font-size="14" fill="#222">error</text>
