<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="-12 -12 378 2141" width="378" height="2141" font-family="Helvetica,Arial,sans-serif">
<title>S3–S4: abstención y expiración</title>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="96.0" text-anchor="middle" font-size="18" fill="#111">1. Restricción confirmada</text>
<rect x="0" y="323" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="419.0" text-anchor="middle" font-size="18" fill="#111">2. Baja confianza o silencio</text>
<rect x="0" y="646" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="742.0" text-anchor="middle" font-size="18" fill="#111">3. Conservar restricción</text>
<rect x="0" y="968" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="1064.0" text-anchor="middle" font-size="18" fill="#111">4. Host solicita expiry</text>
<rect x="0" y="1291" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="1375.5" text-anchor="middle" font-size="18" fill="#111">5. Retirar anteriores al</text>
<text x="160.0" y="1398.5" text-anchor="middle" font-size="18" fill="#111">cutoff</text>
<rect x="0" y="1614" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="1698.5" text-anchor="middle" font-size="18" fill="#111">6. Reconciliar ejes</text>
<text x="160.0" y="1721.5" text-anchor="middle" font-size="18" fill="#111">restantes</text>
<rect x="0" y="1937" width="320" height="180" rx="4" fill="#f5f5f5" stroke="#333"/>
<text x="160.0" y="2033.0" text-anchor="middle" font-size="18" fill="#111">7. Auditar cambio efectivo</text>
<path d="M 160,180 L 160,221 L 160,270 L 160,313" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="239" width="147" height="22" fill="white"/>
<text x="161" y="255" font-size="14" fill="#222">Observación</text>
<text x="161" y="273" font-size="14" fill="#222">posterior</text>
<path d="M 160,503 L 160,544 L 160,593 L 160,635" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="562" width="131" height="22" fill="white"/>
<text x="161" y="578" font-size="14" fill="#222">No es</text>
<text x="161" y="596" font-size="14" fill="#222">recuperación</text>
<path d="M 160,826 L 160,867 L 160,916 L 160,958" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="885" width="177" height="22" fill="white"/>
<text x="161" y="901" font-size="14" fill="#222">Política temporal</text>
<text x="161" y="919" font-size="14" fill="#222">explícita</text>
<path d="M 160,1148 L 160,1190 L 160,1239 L 160,1281" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="1207" width="198" height="22" fill="white"/>
<text x="161" y="1223" font-size="14" fill="#222">cutoff y tiempo actual</text>
<text x="161" y="1241" font-size="14" fill="#222">distintos</text>
<path d="M 160,1471 L 160,1512 L 160,1561 L 160,1604" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="1530" width="157" height="22" fill="white"/>
<text x="161" y="1546" font-size="14" fill="#222">Igual al cutoff</text>
<text x="161" y="1564" font-size="14" fill="#222">sobrevive</text>
<path d="M 160,1794 L 160,1835 L 160,1884 L 160,1927" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="158" y="1853" width="163" height="22" fill="white"/>
<text x="161" y="1869" font-size="14" fill="#222">Solo tras commit</text>
<text x="161" y="1887" font-size="14" fill="#222">exitoso</text>
</svg>
