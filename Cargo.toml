[workspace]
resolver = "2"
members = ["crates/*"]
# Experiments (eval harnesses) are standalone packages, not shipped SDK crates.
exclude = ["experiments"]

# Centralized metadata inherited by each crate via `*.workspace = true`.
# rust-version is the declared MSRV, enforced by the `msrv` CI job.
[workspace.package]
edition = "2021"
rust-version = "1.83"
authors = ["Lucio Yen"]
license = "MIT"
repository = "https://github.com/Kochi-sicem/pgso-sdk"
